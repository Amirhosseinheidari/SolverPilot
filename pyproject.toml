[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solverpilot"
version = "0.1.0rc2"
description = "Trust-aware optimization runtime for mathematical and constraint programming in Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Amirhossein Heidari Rashtabad" }]
maintainers = [{ name = "Amirhossein Heidari Rashtabad" }]
keywords = ["optimization", "linear-programming", "mixed-integer-programming", "quadratic-programming", "conic-optimization", "nonlinear-programming", "minlp", "constraint-programming", "cp-sat", "solver", "reoptimization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
]

[project.scripts]
solverpilot-backend-health = "solverpilot.cli.backend_health:main"
solverpilot-bench = "solverpilot.cli.benchmark:main"
solverpilot-capabilities = "solverpilot.cli.capabilities:main"

[project.optional-dependencies]
quality = ["pytest-cov>=7,<8", "ruff>=0.12,<1", "mypy>=1.17,<2"]
test = ["pytest>=8", "pyyaml>=6", "jsonschema>=4"]
ci = ["pytest>=8", "pyyaml>=6", "jsonschema>=4", "highspy>=1.15.1,<2", "osqp>=1.1.3,<2"]
release = ["build>=1.6,<2", "twine>=7,<8", "packaging>=26,<27", "pip-audit==2.10.1"]
highs = ["highspy>=1.15.1,<2"]
osqp = ["osqp>=1.1.3,<2"]
scip = ["pyscipopt>=6.2.1,<7"]
benchmark = ["benchopt>=1.9.1,<2", "scikit-learn>=1.5,<2"]
open-source = ["highspy>=1.15.1,<2", "osqp>=1.1.3,<2", "pyscipopt>=6.2.1,<7", "nlopt>=2.11,<3"]
native = ["highspy>=1.15.1,<2", "osqp>=1.1.3,<2", "pyscipopt>=6.2.1,<7", "nlopt>=2.11,<3"]
nlopt = ["nlopt>=2.11,<3"]
casadi = ["casadi==3.7.2"]
conic = ["casadi==3.7.2"]
nlp = ["casadi==3.7.2"]
minlp = ["casadi==3.7.2"]
cp = ["ortools==9.15.6755"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "native: requires optional/native third-party solver integrations",
  "evidence: requires frozen external scientific evidence/cache artifacts",
]

[tool.setuptools.package-data]
"solverpilot.capabilities" = ["*.json"]
"solverpilot.bridges" = ["*.json"]
"solverpilot.session" = ["*.json"]
"solverpilot.conic" = ["*.json"]
"solverpilot.nlp" = ["*.json"]
"solverpilot.minlp" = ["*.json"]
"solverpilot.cp" = ["*.json"]

[tool.coverage.run]
branch = true
source = ["solverpilot"]

[tool.coverage.report]
show_missing = true
precision = 1

[tool.ruff]
target-version = "py312"
line-length = 100
