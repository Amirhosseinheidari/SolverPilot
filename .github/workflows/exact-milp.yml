name: Exact MILP qualification

on:
  pull_request:
    paths:
      - 'src/solverpilot/exact/**'
      - 'tests/test_exact*'
      - 'tools/build_exact_runtime.sh'
      - '.github/workflows/exact-milp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgmp-dev libmpfr-dev libboost-dev libtbb-dev zlib1g-dev
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: ${{ runner.temp }}/exact/install
          key: exact-ubuntu24-${{ hashFiles('tools/build_exact_runtime.sh') }}
      - name: Build pinned exact SCIP, SoPlex and VIPR
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash tools/build_exact_runtime.sh "$RUNNER_TEMP/exact"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/exact/install
          key: exact-ubuntu24-${{ hashFiles('tools/build_exact_runtime.sh') }}
      - name: Exercise real certificate generation and verification
        env:
          SOLVERPILOT_EXACT_SCIP: ${{ runner.temp }}/exact/install/bin/scip
          SOLVERPILOT_VIPR: ${{ runner.temp }}/exact/install/bin/viprchk
          LD_LIBRARY_PATH: ${{ runner.temp }}/exact/install/lib
        run: |
          python -m pip install '.[test]'
          python -m pytest tests/test_exact_native.py -ra --junitxml=exact-results.xml
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-milp-evidence
          path: |
            exact-results.xml
            exact-native-evidence/
          retention-days: 30
