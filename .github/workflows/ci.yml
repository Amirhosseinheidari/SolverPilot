name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install ".[ci]"
          python -m pip wheel --no-deps . --wheel-dir ci-dist
          python tools/release_import_guard.py install --wheel ci-dist --install-wheel --receipts installed-imports
      - name: Run regression
        run: python -m pytest -ra --junitxml=test-results.xml
      - name: Run public examples
        shell: bash
        run: |
          for example in examples/[0-9][0-9]_*.py; do
            python "$example"
          done
          python examples/production_inventory.py
      - name: Observe repeated solve resources and deadlines
        run: |
          python -m pip install "psutil>=7,<8"
          python benchmarks/qualify_operations.py --output operations.json
      - name: Require installed artifact identity in every importing process
        if: always()
        run: python tools/release_import_guard.py report --receipts installed-imports --output installed-import-identity.json
      - name: Preserve regression results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results.xml
            operations.json
            installed-import-identity.json
            installed-imports/
          if-no-files-found: warn
          retention-days: 14

  optional-integrations:
    name: optional integrations / ${{ matrix.platform }} / py${{ matrix.python }}
    runs-on: ${{ matrix.platform }}-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows, macos]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install optional solver environment
        run: python -m pip install ".[ci,native,casadi,cp,clarabel,quality]"
      - name: Exercise full suite with native solvers
        run: |
          python -m pytest -ra tests/test_mixed_native_runtime.py
          python -m pytest -ra --cov=solverpilot --cov-branch --cov-report=xml:coverage.xml --cov-fail-under=80 --junitxml=optional-results.xml
      - name: Preserve optional integration results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: optional-integration-results-${{ matrix.platform }}-py${{ matrix.python }}
          path: |
            optional-results.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  minimum-dependencies:
    name: minimum core dependencies / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared minimum runtime versions
        run: python -m pip install ".[test]" "numpy==2.2.0" "scipy==1.15.0"
      - name: Exercise full core suite at dependency floors
        run: python -m pytest -ra --junitxml=minimum-results.xml
      - name: Preserve minimum dependency results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimum-dependency-results
          path: minimum-results.xml
          if-no-files-found: warn
          retention-days: 14

  workflow-comparisons:
    name: workflow comparisons / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install comparison interfaces
        run: python -m pip install ".[test,highs]" "cvxpy==1.9.3" "pyomo==6.10.1"
      - name: Validate challenge and comparison protocols
        run: python -m pytest -q tests/test_production_challenge.py tests/test_compare_lp_workflows.py tests/test_highs_reuse_qualification.py tests/test_public_reuse_qualification.py tests/test_lp_certificate_performance.py tests/test_fixed_certificate_replay.py
      - name: Exercise scoped mutations and all comparison adapters
        run: |
          python benchmarks/challenge_production_evidence.py --output challenge.json
          python benchmarks/compare_lp_workflows.py --preset smoke --steps 3 --repeats 5 --warmups 1 --max-wall-s 120 --presolve --common-proof --workflows solverpilot,solverpilot-reuse,direct-highspy,cvxpy-highs,pyomo-appsi-highs --output comparison.json
          python benchmarks/qualify_highs_reuse.py --sizes 2 4 --scales 1 100 --output reuse-challenge
      - name: Preserve functional comparison observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-comparison-observations
          path: |
            challenge.json
            comparison.json
            reuse-challenge/
          if-no-files-found: warn
          retention-days: 14

  distribution:
    name: build and verify installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build and audit tools
        run: python -m pip install "build>=1.6,<2" "twine>=7,<8" "packaging>=26,<27" "pip-audit==2.10.1"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate release artifacts
        run: |
          python -m twine check --strict dist/*
          python tools/release_dist_manifest.py dist --write
          python tools/release_verify_dist.py dist
      - name: Install and smoke-test the exact wheel
        run: |
          python -m pip install dist/*.whl
          python tools/release_smoke.py --forbid-source-root "$GITHUB_WORKSPACE"
          python examples/production_inventory.py
          python -m solverpilot.cli.doctor --compact > installed-readiness.json
      - name: Audit runtime dependencies
        run: |
          python -m pip install --target audit-site dist/*.whl
          python tools/release_runtime_requirements.py --path audit-site --output runtime-requirements.txt
          python -m pip_audit -r runtime-requirements.txt --strict --format json --output dependency-audit.json
      - name: Qualify production pilot in two clean wheel installations
        run: python benchmarks/qualify_production_install.py --wheel dist/solverpilot-*.whl --output pilot-install --repeats 2 --include-model
      - name: Preserve build and audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-distribution
          path: |
            dist/
            dependency-audit.json
            runtime-requirements.txt
            installed-readiness.json
            pilot-install/qualification.json
            pilot-install/runtime-lock.txt
            pilot-install/portable-pilot.zip
            pilot-install/*/qualification.json
            pilot-install/*-clean-replay.json
          if-no-files-found: warn
          retention-days: 14

  static-correctness:
    name: static correctness / py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned static checker
        run: python -m pip install "ruff==0.16.6" "mypy==1.20.2" "pytest>=8" "numpy>=2.2,<3" "scipy>=1.15,<2" "pyyaml>=6"
      - name: Compile all Python sources
        run: python -m compileall -q src tests tools benchmarks
      - name: Run correctness-focused Ruff rules
        run: ruff check --select E9,F63,F7,F82 src tests tools benchmarks
      - name: Check typed common API contracts
        run: python -m mypy
      - name: Run release hardening contracts
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_final_release_hardening.py
      - name: Compare bounded verification preparation reuse
        env:
          PYTHONPATH: src
        run: python benchmarks/qualify_verification_workspace.py --output verification-workspace.json
      - name: Preserve verification observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-workspace
          path: verification-workspace.json
          if-no-files-found: error
          retention-days: 14
