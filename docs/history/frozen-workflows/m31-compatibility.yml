name: M31 compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-matrix:
    name: core / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install base + tests
        run: python -m pip install ".[test]"
      - name: Static Python 3.10 syntax floor
        run: python tools/m31_static_compat.py
      - name: Release smoke
        run: python tools/m31_ci_smoke.py
      - name: Full regression
        run: python -m pytest

  native-python-matrix:
    name: native / ubuntu / py${{ matrix.python }} / ${{ matrix.extra }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        extra: [highs, osqp, scip, nlopt, casadi]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install extra
        run: python -m pip install ".[test,${{ matrix.extra }}]"
      - name: Backend smoke
        run: python tools/m31_ci_smoke.py --require-extra "${{ matrix.extra }}"

  native-os-matrix:
    name: native / ${{ matrix.os }} / py3.13 / ${{ matrix.extra }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        extra: [highs, osqp, scip, nlopt, casadi]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install extra
        run: python -m pip install ".[test,${{ matrix.extra }}]"
      - name: Backend smoke
        run: python tools/m31_ci_smoke.py --require-extra "${{ matrix.extra }}"
