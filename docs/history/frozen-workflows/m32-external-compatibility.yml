name: M32 exact-artifact compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-dist:
    name: build exact release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release tooling
        run: python -m pip install ".[release]"
      - name: Build wheel and sdist once
        run: python -m build --outdir dist
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Freeze distribution digests
        run: python tools/m32_dist_manifest.py dist --write
      - name: Attest release artifacts
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload exact distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m32-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  core-matrix:
    name: core / ${{ matrix.os }} / py${{ matrix.python }}
    needs: build-dist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Download exact distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m32-dist
          path: dist
      - name: Verify artifact digests
        run: python tools/m32_verify_dist.py dist
      - name: Install exact wheel and test dependencies
        run: python tools/m32_install_wheel.py --dist dist --test
      - name: Resolver and dependency consistency evidence
        run: python tools/m32_resolver_report.py > m32-resolver.json
      - name: Exact-wheel release smoke
        run: python tools/m32_release_smoke.py > m32-smoke.json
      - name: Full regression against installed wheel
        run: python -m pytest --junitxml=m32-pytest.xml
      - name: Upload cell evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            m32-resolver.json
            m32-smoke.json
            m32-pytest.xml
          if-no-files-found: warn

  native-python-matrix:
    name: native / ubuntu / py${{ matrix.python }} / ${{ matrix.extra }}
    needs: build-dist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        extra: [highs, osqp, scip, nlopt, casadi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m32-dist
          path: dist
      - name: Verify artifact digests
        run: python tools/m32_verify_dist.py dist
      - name: Install exact wheel and requested optional dependency
        run: python tools/m32_install_wheel.py --dist dist --test --extra "${{ matrix.extra }}"
      - name: Resolver and dependency consistency evidence
        run: python tools/m32_resolver_report.py > m32-resolver.json
      - name: Require exact optional backend
        run: python tools/m32_release_smoke.py --require-extra "${{ matrix.extra }}" > m32-smoke.json
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ubuntu-py${{ matrix.python }}-${{ matrix.extra }}
          path: |
            m32-resolver.json
            m32-smoke.json
          if-no-files-found: warn

  native-os-matrix:
    name: native / ${{ matrix.os }} / py3.13 / ${{ matrix.extra }}
    needs: build-dist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        extra: [highs, osqp, scip, nlopt, casadi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m32-dist
          path: dist
      - name: Verify artifact digests
        run: python tools/m32_verify_dist.py dist
      - name: Install exact wheel and requested optional dependency
        run: python tools/m32_install_wheel.py --dist dist --test --extra "${{ matrix.extra }}"
      - name: Resolver and dependency consistency evidence
        run: python tools/m32_resolver_report.py > m32-resolver.json
      - name: Require exact optional backend
        run: python tools/m32_release_smoke.py --require-extra "${{ matrix.extra }}" > m32-smoke.json
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.os }}-py3.13-${{ matrix.extra }}
          path: |
            m32-resolver.json
            m32-smoke.json
          if-no-files-found: warn

  technical-compatibility-gate:
    name: M32 technical compatibility gate
    if: always()
    needs: [build-dist, core-matrix, native-python-matrix, native-os-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Require every intended execution job to pass
        env:
          BUILD_RESULT: ${{ needs.build-dist.result }}
          CORE_RESULT: ${{ needs.core-matrix.result }}
          NATIVE_PY_RESULT: ${{ needs.native-python-matrix.result }}
          NATIVE_OS_RESULT: ${{ needs.native-os-matrix.result }}
        run: |
          python - <<'PY'
          import json, os, sys
          results={k:os.environ[k] for k in ["BUILD_RESULT","CORE_RESULT","NATIVE_PY_RESULT","NATIVE_OS_RESULT"]}
          ok=all(v=="success" for v in results.values())
          print(json.dumps({"schema":"optimind.m32.ci_gate.v1","results":results,"technical_compatibility_passed":ok},sort_keys=True))
          raise SystemExit(0 if ok else 2)
          PY
